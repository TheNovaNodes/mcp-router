# ============================================================================
# MCP Router - Configuration Example
# ============================================================================
# High-performance Model Context Protocol (MCP) gateway and multiplexer.
# Copy this template to config.yaml and configure for your environment:
#   cp config.example.yaml config.yaml
#
# Environment variables using ${VAR_NAME} syntax are expanded automatically.
# ============================================================================

# Audit logging configuration (optional)
audit:
  path: "/var/log/mcp-router/audit.jsonl"
  fallback_path: "./audit.jsonl"
  required: false

# Authentication configuration
auth:
  enabled: true
  bearer_token: "${MCP_ROUTER_BEARER_TOKEN}"
  allow_query_token: true # Set true to allow ?token= auth for header-constrained clients

# TLS / HTTPS configuration (optional)
# tls:
#   enabled: true
#   cert_file: "/etc/mcp-router/certs/server.crt"
#   key_file: "/etc/mcp-router/certs/server.key"

# ============================================================================
# MCP Servers & Backends
# ============================================================================
# Each server MUST specify:
#   - transport: "stdio" or "streamable_http" (also supports "http", "sse")
#   - prefix: Unique namespace ending in '_' or '__' (e.g., 'db__', 'gh__')
#
# Optional parameters:
#   - max_concurrent: Max parallel requests per backend (e.g. 10)
#   - timeout: Execution timeout in seconds (default: 60)
#   - allowed_agents: Restrict entire backend to specific agent IDs
#   - tools_allowlist: Whitelist specific tools on backend
#   - agent_tools_allowlist: Per-agent granular tool allowlists
# ============================================================================
servers:
  # Example 1: Local stdio backend (PostgreSQL database inspector)
  postgres-db:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-postgres"
      - "${POSTGRES_CONNECTION_STRING}"
    prefix: db__
    max_concurrent: 10
    timeout: 30
    allowed_agents:
      - "backend_agent"
      - "admin_agent"
    tools_allowlist:
      - "query"
      - "list_tables"
      - "describe_table"

  # Example 2: Local stdio backend (Filesystem tools with granular agent permissions)
  filesystem:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "/app/data"
    prefix: fs__
    timeout: 15
    agent_tools_allowlist:
      readonly_agent:
        - "read_file"
        - "list_directory"
      admin_agent:
        - "read_file"
        - "write_file"
        - "list_directory"
        - "create_directory"

  # Example 3: Local stdio backend (GitHub toolset with Role Matrix & Hard HITL Guard)
  github:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PAT}
    prefix: gh__
    allowed_agents:
      - "builder_agent"
      - "auditor_agent"
      - "researcher_agent"
    agent_tools_allowlist:
      # Researchers: Read-only on code, Issue triage/spec authoring, PR & Smoke inspection. Hard ban on mutation/review/merge.
      researcher_agent:
        - "get_file_contents"
        - "list_commits"
        - "search_repositories"
        - "search_code"
        - "search_issues"
        - "list_issues"
        - "get_issue"
        - "create_issue"
        - "update_issue"
        - "add_issue_comment"
        - "list_pull_requests"
        - "get_pull_request"
        - "get_pull_request_status"
        - "get_pull_request_files"
        - "get_pull_request_reviews"
        - "get_pull_request_comments"
      # Builders: Code mutation monopoly, branch creation, PR opening/updating. Hard ban on review and merge.
      builder_agent:
        - "get_file_contents"
        - "create_branch"
        - "push_files"
        - "update_pull_request_branch"
        - "create_pull_request"
        - "get_pull_request"
        - "get_pull_request_status"
        - "get_pull_request_files"
        - "list_pull_requests"
        - "get_pull_request_reviews"
        - "get_pull_request_comments"
        - "list_commits"
        - "search_repositories"
        - "search_code"
        - "search_issues"
        - "list_issues"
        - "get_issue"
        - "create_issue"
        - "update_issue"
        - "add_issue_comment"
      # Auditors: Hostile review monopoly, PR status/review, L2 audit branch tests, merge gated by Hard HITL. Hard ban on creating feature PRs.
      auditor_agent:
        - "get_file_contents"
        - "create_branch"
        - "push_files"
        - "search_repositories"
        - "search_code"
        - "search_issues"
        - "list_issues"
        - "get_issue"
        - "create_issue"
        - "update_issue"
        - "add_issue_comment"
        - "list_pull_requests"
        - "get_pull_request"
        - "get_pull_request_status"
        - "get_pull_request_files"
        - "get_pull_request_reviews"
        - "get_pull_request_comments"
        - "create_pull_request_review"
        - "list_commits"
        - "merge_pull_request" # Intercepted by Hard HITL guard requiring explicit human authorization


  # Example 4: Remote HTTP / SSE backend (Documentation & Search service)
  remote-docs:
    transport: streamable_http
    url: "https://mcp.example.com/docs"
    headers:
      Authorization: "Bearer ${DOCS_SERVICE_TOKEN}"
    prefix: docs__
    timeout: 20
    # Omitting allowed_agents leaves this backend accessible to all authenticated agents
