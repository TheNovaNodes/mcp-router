name: 🛡️ Security Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: TheNovaNodes/.github/actions/secret-scan@4b5f7b80746ac50f6874d0e44d12af768a05a8a9 # master
