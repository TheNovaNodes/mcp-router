on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - uses: TheNovaNodes/.github/actions/secret-scan@master
